name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Clé publique Web3Forms, figée au build : sans elle, le formulaire se
      # rend désactivé et le bouton de devis n'envoie rien. Elle finit dans le
      # bundle client, ce n'est donc pas un secret mais une variable de dépôt
      # (Settings > Secrets and variables > Actions > Variables).
      - run: npm run build
        env:
          NEXT_PUBLIC_CONTACT_KEY: ${{ vars.CONTACT_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
